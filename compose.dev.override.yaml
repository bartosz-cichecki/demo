services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    volumes:
      - ./app:/var/www/app

  postgres:
    ports:
      - "${DEMO_POSTGRES_PORT:-55432}:5432"

  nginx:
    ports:
      - "${DEMO_HTTP_PORT:-8082}:80"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
