deptrac:
  paths:
    - src
  exclude_files:
    - '#src/Kernel\.php#'
  layers:
    - name: SharedKernelDomainClock
      collectors:
        - type: directory
          value: src/SharedKernel/Domain/Clock/.*
    - name: SharedKernelDomainValueObject
      collectors:
        - type: directory
          value: src/SharedKernel/Domain/ValueObject/.*
    - name: SharedKernelDomainCore
      collectors:
        - type: directory
          value: src/SharedKernel/Domain/(?!(Clock|ValueObject)/).*
    - name: Ui
      collectors:
        - type: directory
          value: src/.*/Ui/.*
    - name: Application
      collectors:
        - type: directory
          value: src/.*/Application/.*
    - name: Domain
      collectors:
        - type: directory
          value: src/(?!SharedKernel/Domain/).*/Domain/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/.*/Infrastructure/.*
    - name: DoctrineMapping
      collectors:
        - type: classNameRegex
          value: '#^Doctrine\\ORM\\Mapping\\#'
    - name: External
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\#'
        - type: classNameRegex
          value: '#^Doctrine\\(?!ORM\\Mapping\\)#'
        - type: classNameRegex
          value: '#^Monolog\\#'
        - type: classNameRegex
          value: '#^Twig\\#'
    - name: PsrContracts
      collectors:
        - type: classNameRegex
          value: '#^Psr\\#'
    - name: UuidVendor
      collectors:
         - type: classNameRegex
           value: '#^Ramsey\\Uuid\\#'
  ruleset:
    SharedKernelDomainClock:
      - SharedKernelDomainValueObject
    SharedKernelDomainCore:
      - SharedKernelDomainClock
    SharedKernelDomainValueObject:
      - SharedKernelDomainCore
      - UuidVendor
    Ui:
      - Application
      - Domain
      - External
      - PsrContracts
      - SharedKernelDomainClock
      - SharedKernelDomainCore
      - SharedKernelDomainValueObject
    Application:
      - Domain
      - SharedKernelDomainClock
      - SharedKernelDomainCore
      - SharedKernelDomainValueObject
    Domain:
      - SharedKernelDomainClock
      - SharedKernelDomainCore
      - SharedKernelDomainValueObject
      - DoctrineMapping
    Infrastructure:
      - Application
      - Domain
      - External
      - PsrContracts
      - SharedKernelDomainClock
      - SharedKernelDomainCore
      - SharedKernelDomainValueObject
    External: ~
    PsrContracts: ~
    DoctrineMapping: ~
    UuidVendor: ~
